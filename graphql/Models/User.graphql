type User {
    id: ID!
    name: String
    first_name: String!
    middle_name: String
    last_name: String!
    phone: String
    email: String!
    password: String!
    is_active: Boolean!
    is_admin: Boolean! @method(name: "is_admin")
    roles: [Role]! @morphToMany
    permissions: [Permission] @field(resolver: "App\\GraphQL\\Resolvers\\UserResolver@permissions")
    created_at: DateTime!
    updated_at: DateTime!
    deleted_at: DateTime
}

input UserInput {
    id: ID
    first_name: String
    middle_name: String
    last_name: String
    phone: String
    email: String
    password: String
    is_active: Boolean
    roles: ConnectRolesRelation
}

input ConnectUserRelation {
    id: ID
    connect: ID
    upsert: UserInput
    delete: ID
}

input RegisterInput {
    first_name: String
    middle_name: String
    last_name: String
    phone: String
    email: String
    password: String
}

input SortInput {
    column: String
    direction: String
}

input FilterInput {
    key: String
    value: String
    label: String
}

extend type Query {
    users: [User]! @all
    usersPaginate(
        first: Int!
        page: Int
        search: String @scope(name: "search")
        sort: SortInput @scope(name: "sort")
        filter: [FilterInput] @scope(name: "filter")
    ): [User]! @paginate
}

extend type Mutation {
    registerUser(input: RegisterInput! @spread): User! @create
    upsertUser(input: UserInput!): User! @field(resolver: "App\\GraphQL\\Mutations\\UserMutator@upsertUser")
    deleteUser(id: [ID!] @eq): [User] @delete
    restoreUser(id: ID!): User! @restore
    updateUserStatus(id: ID!, is_active: Boolean!): User @field(resolver: "App\\GraphQL\\Mutations\\UserMutator@updateStatus")
}


